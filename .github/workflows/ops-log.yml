name: ops-log
# Mirrors docs/OPERATIONS.md into the Supabase table ops_log (backup). The markdown is the source of truth.
on:
  push:
    branches: [main]
    paths: [docs/OPERATIONS.md, scripts/ops-log.mjs]
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/ops-log.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
