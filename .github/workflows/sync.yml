name: sync-portfolio
on:
  push:
    branches: [main]
    paths: [portfolio.config.json, scripts/sync.mjs, "content/**"]
  schedule: [{ cron: '0 * * * *' }] # hourly: picks up edits in the source repos, stars, last push
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sync.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }} # optional: read-only token for the private network-project repo
