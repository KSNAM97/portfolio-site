name: sync-portfolio
on:
  push:
    branches: [main]
    paths: [portfolio.config.json, scripts/sync.mjs, "content/**"]
  schedule: [{ cron: '0 * * * *' }] # hourly: picks up edits in the source repos, stars, last push
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sync.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }} # optional: read-only token for the private network-project repo
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }} # optional: Jira progress (counts only)
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      # optional: set the SLACK_WEBHOOK_URL secret to enable. Hourly runs stay silent unless they fail.
      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != '' && (failure() || github.event_name != 'schedule')
        run: |
          if [ "${{ job.status }}" = "success" ]; then icon="OK"; else icon="FAILED"; fi
          msg="[portfolio-site] sync $icon (${{ github.event_name }}) - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS -X POST -H 'Content-type: application/json' --data "$(jq -nc --arg t "$msg" '{text:$t}')" "$SLACK_WEBHOOK_URL"
